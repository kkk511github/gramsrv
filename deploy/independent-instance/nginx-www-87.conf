server {
    listen 80;
    listen [::]:80;
    server_name www.safelink.chat;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://www.safelink.chat$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.safelink.chat;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/safelink-www/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/safelink-www/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:2401;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        client_max_body_size 16m;
    }
}
